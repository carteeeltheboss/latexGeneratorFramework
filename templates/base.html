<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agentic Presentation Builder{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">AP</span>
      <span><strong>Agentic Presentation Builder</strong><small>EMSI-ready Beamer + TikZ generator</small></span>
    </a>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">Runs locally. No database. No project data is sent anywhere.</footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
